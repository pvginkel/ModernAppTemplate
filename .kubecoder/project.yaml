# Curated entry points for ModernAppTemplate: the root template (this repo) and
# the backend and frontend templates, checked out at backend/ and frontend/
# (separate git repos, see .kubecoder/config.yaml).
#
# Each template is validated through a generated test-app: `build` regenerates
# it from the template (regen.sh), `test` and `lint` run the gates against it.
# So after a template edit, run `kc project build` before `test` or `lint`.
#
# Component order is load-bearing: root/regen.sh copies the backend and
# frontend test-apps into root/test-app, and the backend mother suite takes the
# SSE gateway from frontend/test-app/node_modules. So root comes last.
#
# backend/test-app and frontend/test-app are tracked in their template repos,
# and a regen churns their lockfiles and .copier-answers.yml. That churn is the
# normal template workflow for `build`, but pod start should not dirty the
# trees, so `setup` regenerates only a test-app that was never generated here,
# keyed on a gitignored file regen.sh writes.
projects:
  backend:
    description: >-
      ModernAppBackendTemplate — the Copier template for Flask backends. Work
      in template/, then `kc project build` to regenerate test-app.
    setup:
      - cexec modern-app poetry install --no-interaction
      - test -f test-app/.env.test || cexec modern-app bash regen.sh
      # .env.test is the harness's, not the template's; keep test-app's copy
      # current without a regen.
      - cp .env.test test-app/.env.test
    build: cexec modern-app bash regen.sh
    # Two runs: the mother suite (../tests) and the domain suite (tests/) share
    # the module name tests.conftest, so they cannot run in one pytest process.
    # The mother suite needs the s3storage sidecar (config.yaml).
    test:
      - cexec modern-app sh -c 'cd test-app && poetry run pytest ../tests/'
      - cexec modern-app sh -c 'cd test-app && poetry run pytest tests/'
    # test-app's own `poetry run check` minus its pytest step, which is `test:`.
    lint:
      - cexec modern-app sh -c 'cd test-app && poetry run ruff check .'
      - cexec modern-app sh -c 'cd test-app && poetry run mypy .'
      - cexec modern-app sh -c 'cd test-app && poetry run vulture app/ vulture_whitelist.py --min-confidence 80'

  frontend:
    description: >-
      ModernAppFrontendTemplate — the Copier template for React/Vite frontends.
      Work in template/, then `kc project build` to regenerate test-app.
    setup:
      - cexec modern-app poetry install --no-interaction
      - test -f test-app/src/routeTree.gen.ts || cexec modern-app bash regen.sh
    build:
      - cexec modern-app bash regen.sh
      - cexec modern-app sh -c 'cd test-app && pnpm run build'
    # eslint, tsc and knip.
    lint: cexec modern-app sh -c 'cd test-app && pnpm run check'

  root:
    description: >-
      The root template (root/template, versioned by this repo's tags), plus
      the shared docs, the coordinated changelog and the cross-repo scripts.
      Its test-app, root/test-app, wraps copies of the backend and frontend
      test-apps into a complete monorepo.
    setup: test -d root/test-app || cexec modern-app bash root/regen.sh
    build: cexec modern-app bash root/regen.sh
    # The generated monorepo's suite runner, as CI's validation Job runs it.
    # Backend suite only. `--suite frontend` (the frontend template's
    # Playwright specs) passes, but runs the modern-app sidecar up to its
    # 5 GiB memory limit, and one run took the container down. Run it by hand:
    #   cexec modern-app sh -c 'cd root/test-app && poetry run run-suite --suite frontend'
    test: cexec modern-app sh -c 'cd root/test-app && poetry run run-suite --suite backend'
    lint: cexec modern-app sh -c 'cd root/test-app && poetry run ruff check scripts tools'
